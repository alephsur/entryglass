[project]
name = "entryglass-api"
version = "0.1.0"
description = "Initial API scaffold for Entryglass, a historical trade-context research tool."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.128.0,<1.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "uvicorn>=0.40.0,<1.0.0",
]

[project.scripts]
entryglass-validate-nansen = "entryglass.infrastructure.nansen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entryglass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
